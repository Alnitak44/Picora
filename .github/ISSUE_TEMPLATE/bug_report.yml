name: 问题反馈
description: 报告 Picora 的异常或行为问题
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: 请提供复现步骤，分享日志前移除密钥与私人链接。
  - type: input
    id: version
    attributes:
      label: Picora 版本
      placeholder: 例如 1.0.0-debug
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 设备与 Android 版本
      placeholder: 手机型号、Android 版本、ARM64
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: 图床或插件
      description: 上传问题请填写图床类型；插件请提供 ID 和版本。
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从哪个页面、进行了什么操作、发生了什么。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志与截图
      description: 设置 → 诊断日志；附诊断编号或脱敏片段，不要上传账号配置。
