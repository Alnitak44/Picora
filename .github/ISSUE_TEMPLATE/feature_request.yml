name: 功能建议
description: 提出 Picora 的功能或使用体验建议
title: "[Feature]: "
body:
  - type: input
    id: version
    attributes:
      label: Picora 版本
      placeholder: 例如 1.0.0-debug
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与遇到的问题
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 希望实现的行为
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案或参考
      description: 新图床建议请附官方接口文档地址，不要提供真实账号密钥。
