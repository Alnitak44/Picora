pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withReader('UTF-8') { properties.load(it) }
        // Flutter writes UTF-8 paths, while Android/Java readers use ISO-8859-1.
        // Store non-ASCII paths as Unicode escapes for both readers.
        file("local.properties").withOutputStream {
            properties.store(it, 'Local Android and Flutter SDK paths')
        }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.8.0" apply false
    id "org.jetbrains.kotlin.android" version "2.1.0" apply false
    id "com.google.protobuf" version "0.9.1" apply false
}

include ":app"

// Preserve the pinned PDF Dart package, with its Android v2 registration patch.
project(":syncfusion_flutter_pdfviewer").projectDir = file("vendor/syncfusion_flutter_pdfviewer")
